<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --sky: #a8dcf0;
    --panel: rgba(255, 250, 241, 0.94);
    --ink: #3a2e24;
    --muted: #8a7a6a;
    --line: #eadfcd;
    --shadow: 0 6px 0 rgba(58, 46, 36, 0.12), 0 12px 30px rgba(0, 0, 0, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink); font-family: Fredoka, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  .hud { position: fixed; pointer-events: auto; background: var(--panel); border: 2px solid #fff; border-radius: 18px; box-shadow: var(--shadow); backdrop-filter: blur(6px); }

  /* Top bar */
  .topbar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
  .brand { padding: 8px 16px; display: flex; align-items: center; gap: 10px; position: static; }
  .brand h1 { margin: 0; white-space: nowrap; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #ff8a5b, #f2c14e); display: grid; place-items: center; font-size: 18px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  #stats { padding: 8px 10px; display: flex; gap: 6px; flex-wrap: wrap; position: static; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: #fff; border: 2px solid color-mix(in srgb, var(--c) 35%, #fff); font-size: 13px; }
  .chip b { color: var(--c); }
  .clockbox { margin-left: auto; padding: 6px 8px 6px 14px; display: flex; align-items: center; gap: 10px; position: static; }
  #clock { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 6px 12px; background: #fff; box-shadow: inset 0 -3px 0 #e2d6c2; border: 2px solid #eadfcd; }
  button:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 #e2d6c2; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .winbox { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid #eadfcd; border-radius: 12px; padding: 4px 8px; box-shadow: inset 0 -3px 0 #e2d6c2; }
  .winbox select { font: inherit; border: 0; background: transparent; color: inherit; cursor: pointer; padding: 2px 2px; outline: none; }
  .winbox.busy { opacity: .6; }

  /* Panel agent */
  #panel { top: 78px; right: 12px; bottom: 12px; width: 320px; display: flex; flex-direction: column; padding: 14px 12px 12px; }
  #panel h2 { margin: 0 4px 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  #panel h2 span { background: var(--ink); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 12px; }
  #agentList { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; background: #fff; border-radius: 14px; border: 2px solid transparent; cursor: pointer; transition: transform .12s, border-color .12s; }
  .row:hover { transform: translateY(-1px); border-color: var(--line); }
  .row.sel { border-color: var(--ink); }
  .row.pulse { animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(242,162,12,.0); } 50% { box-shadow: 0 0 0 4px rgba(242,162,12,.35); } }
  .chip.pulse { animation: pulse 1.4s infinite; }
  .av { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  .av.big { width: 48px; height: 48px; font-size: 22px; }
  .meta { min-width: 0; flex: 1; }
  .meta .top { display: flex; align-items: center; gap: 6px; }
  .meta .task { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src-badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: #eef2ff; color: #3949ab; }
  .src-badge.grok { background: #1f1f1f; color: #fff; }
  .pill { flex: none; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, #fff); color: color-mix(in srgb, var(--c) 80%, #000); white-space: nowrap; }
  .legend { margin-top: auto; padding: 10px 4px 0; border-top: 2px dashed var(--line); font-size: 11px; color: var(--muted); display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }

  body:not(.panel-open) #panel { display: none; }
  body.panel-open #panelBtn { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: none; }
  body.hud-off .hud, body.hud-off .zone-label { display: none; }
  .empty { padding: 18px 10px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
  #mode .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #1fa774; margin-right: 5px; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .src-badge.claude, .tag .src.claude { background: #d97757; color: #fff; }
  .src-badge.cursor, .tag .src.cursor { background: #0b7285; color: #fff; }
  .src-badge.gemini, .tag .src.gemini { background: #4285f4; color: #fff; }
  .src-badge.other, .tag .src.other { background: #e9ecef; color: #495057; }

  /* Feed */
  #feed { left: 12px; bottom: 12px; width: 400px; padding: 10px 14px; }
  #feed h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  #feedList { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #feedList li { display: flex; align-items: center; gap: 7px; padding: 3px 0; white-space: nowrap; overflow: hidden; animation: slide .35s ease-out; }
  #feedList li span { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #feedList time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  #feedList i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  @keyframes slide { from { opacity: 0; transform: translateX(-10px); } }

  /* Kartu detail */
  #card { top: 78px; left: 12px; width: 300px; padding: 14px; }
  #card.hidden { display: none; }
  #card .x { position: absolute; top: 10px; right: 10px; padding: 2px 9px; }
  .card-head { display: flex; gap: 12px; align-items: center; }
  .card-head h3 { margin: 0 0 2px; font-size: 20px; }
  .state-line { margin: 12px 0 8px; display: flex; gap: 8px; align-items: center; }
  .walking { font-size: 12px; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 500; word-break: break-word; }
  code { font-size: 12px; background: #f3ece0; padding: 1px 6px; border-radius: 6px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; font-size: 13px; }
  .hint { margin: 8px 0 0; font-size: 11px; color: var(--muted); text-align: center; }

  /* Label karakter di scene */
  .char-label { pointer-events: none; }
  .char-label .inner { transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tag { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; background: rgba(255,255,255,.95); font-size: 12px; font-weight: 600; box-shadow: 0 2px 0 rgba(0,0,0,.12); border: 2px solid var(--c); white-space: nowrap; }
  .tag .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
  .tag .src { font-size: 9px; padding: 0 4px; border-radius: 6px; background: #eef2ff; color: #3949ab; }
  .tag .src.grok { background: #1f1f1f; color: #fff; }
  .bubble { position: relative; display: flex; align-items: center; gap: 4px; padding: 3px 8px; background: #fff; border-radius: 12px; font-size: 12px; box-shadow: 0 2px 0 rgba(0,0,0,.12); white-space: nowrap; animation: bob 2.4s ease-in-out infinite; }
  .bubble::after { content: ''; position: absolute; bottom: -5px; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .bubble .tx { display: none; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .char-label.fresh .tx, .char-label.hover .tx, .char-label.selected .tx { display: inline; }
  .char-label.selected .tag { background: var(--c); color: #fff; }
  .char-label.alert .bubble { background: #fff3d6; }
  .char-label.alert .bubble::after { border-top-color: #fff3d6; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .zone-label { font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: rgba(58,46,36,.75); background: rgba(255,255,255,.55); padding: 2px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none; }

  @media (max-width: 760px) {
    #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 36vh; border-radius: 18px 18px 0 0; }
    #feed { display: none; }
    #card { left: 16px; right: 16px; width: auto; top: 70px; }
    .brand small, #stats { display: none; }
    .topbar { left: 16px; right: 16px; }
    .legend { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="stage"></div>

  <header class="topbar">
    <div class="hud brand"><span class="logo">🏢</span><div><h1 data-i18n="app.title">Agent HQ</h1><small id="mode" data-i18n="app.loading">memuat…</small></div></div>
    <div class="hud" id="stats"></div>
    <div class="hud clockbox"><span id="clock">--:--</span><button id="timeBtn">🕑 <span data-i18n="hud.clockAuto">Otomatis</span></button>
      <button id="langBtn" title="Language / Bahasa">🇮🇩 ID</button>
      <label class="winbox" data-i18n-title="hud.tooltip.window" title="Rentang waktu agent yang ditampilkan"><span>⏱️</span>
        <select id="windowSelect" data-i18n-aria="hud.windowLabel" aria-label="Rentang waktu">
          <option value="60">1 jam</option>
          <option value="360">6 jam</option>
          <option value="1440" selected>24 jam</option>
          <option value="4320">3 hari</option>
          <option value="10080">7 hari</option>
          <option value="43200">30 hari</option>
        </select>
      </label>
      <button id="panelBtn" data-i18n-title="hud.tooltip.agents" title="Daftar agent (A)">👥 <b id="count"></b></button><button id="fsBtn" data-i18n-title="hud.tooltip.fullscreen" title="Layar penuh">⛶</button></div>
  </header>

  <aside class="hud" id="panel">
    <h2 data-i18n="panel.title">Agent</h2>
    <ul id="agentList"></ul>
    <div class="legend">
      <span>💻 <span data-i18n="zone.desk">Ruang kerja = ngoding / berpikir</span></span>
      <span>⚙️ <span data-i18n="zone.server">Server = jalanin command</span></span>
      <span>📖 <span data-i18n="zone.library">Perpustakaan = baca/cari</span></span>
      <span>✋ <span data-i18n="zone.meeting">Rapat = nunggu kamu</span></span>
      <span>🌳 <span data-i18n="zone.leisure">Taman / Kafe & Kolam / Lapangan = santai</span></span>
      <span>🚑 <span data-i18n="zone.clinic">Klinik = error</span></span>
    </div>
  </aside>

  <section class="hud" id="feed"><h3 data-i18n="hud.activity">Aktivitas</h3><ul id="feedList"></ul></section>

  <div class="hud hidden" id="card"><button class="x" aria-label="Tutup">✕</button><div class="body"></div></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
