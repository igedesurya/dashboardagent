<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --sky: #a8dcf0;
    --panel: rgba(255, 250, 241, 0.94);
    --ink: #3a2e24;
    --muted: #8a7a6a;
    --line: #eadfcd;
    --shadow: 0 6px 0 rgba(58, 46, 36, 0.12), 0 12px 30px rgba(0, 0, 0, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink); font-family: Fredoka, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  .hud { position: fixed; pointer-events: auto; background: var(--panel); border: 2px solid #fff; border-radius: 18px; box-shadow: var(--shadow); backdrop-filter: blur(6px); }

  /* Top bar */
  .topbar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
  .brand { padding: 8px 16px; display: flex; align-items: center; gap: 10px; position: static; }
  .brand h1 { margin: 0; white-space: nowrap; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #ff8a5b, #f2c14e); display: grid; place-items: center; font-size: 18px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  #stats { padding: 8px 10px; display: flex; gap: 6px; flex-wrap: nowrap; position: static; min-width: 0; overflow: hidden; }
  /* Top bar pieces keep their size; only the stats strip gives way (and hides) when space runs out. */
  .topbar > .hud { flex: none; }
  .topbar > #stats { flex: 0 1 auto; }
  .topbar button, .chip { white-space: nowrap; }
  body.project-mode #stats { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: #fff; border: 2px solid color-mix(in srgb, var(--c) 35%, #fff); font-size: 13px; }
  .chip b { color: var(--c); }
  .clockbox { margin-left: auto; padding: 6px 8px 6px 14px; display: flex; align-items: center; gap: 10px; position: static; }
  #clock { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 6px 12px; background: #fff; box-shadow: inset 0 -3px 0 #e2d6c2; border: 2px solid #eadfcd; }
  button:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 #e2d6c2; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .winbox { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid #eadfcd; border-radius: 12px; padding: 4px 8px; box-shadow: inset 0 -3px 0 #e2d6c2; }
  .winbox select { font: inherit; border: 0; background: transparent; color: inherit; cursor: pointer; padding: 2px 2px; outline: none; }
  .winbox.busy { opacity: .6; }

  /* Panel agent */
  #panel { top: 78px; right: 12px; bottom: 12px; width: 320px; display: flex; flex-direction: column; padding: 14px 12px 12px; }
  #panel h2 { margin: 0 4px 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  #panel h2 span { background: var(--ink); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 12px; }
  #agentList { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; background: #fff; border-radius: 14px; border: 2px solid transparent; cursor: pointer; transition: transform .12s, border-color .12s; }
  .row:hover { transform: translateY(-1px); border-color: var(--line); }
  .row.sel { border-color: var(--ink); }
  .row.pulse { animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(242,162,12,.0); } 50% { box-shadow: 0 0 0 4px rgba(242,162,12,.35); } }
  .chip.pulse { animation: pulse 1.4s infinite; }
  .av { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  .av.big { width: 48px; height: 48px; font-size: 22px; }
  .meta { min-width: 0; flex: 1; }
  .meta .top { display: flex; align-items: center; gap: 6px; }
  .meta .task { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src-badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: #eef2ff; color: #3949ab; }
  .src-badge.grok { background: #1f1f1f; color: #fff; }
  .pill { flex: none; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, #fff); color: color-mix(in srgb, var(--c) 80%, #000); white-space: nowrap; }
  .legend { margin-top: auto; padding: 10px 4px 0; border-top: 2px dashed var(--line); font-size: 11px; color: var(--muted); display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }

  body:not(.panel-open) #panel { display: none; }
  body.panel-open #panelBtn { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: none; }
  body.hud-off .hud, body.hud-off .zone-label { display: none; }
  .empty { padding: 18px 10px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
  #mode .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #1fa774; margin-right: 5px; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .src-badge.claude, .tag .src.claude { background: #d97757; color: #fff; }
  .src-badge.cursor, .tag .src.cursor { background: #0b7285; color: #fff; }
  .src-badge.gemini, .tag .src.gemini { background: #4285f4; color: #fff; }
  .src-badge.other, .tag .src.other { background: #e9ecef; color: #495057; }

  /* Feed */
  #feed { left: 12px; bottom: 12px; width: 400px; padding: 10px 14px; }
  #feed h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  #feedList { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #feedList li { display: flex; align-items: center; gap: 7px; padding: 3px 0; white-space: nowrap; overflow: hidden; animation: slide .35s ease-out; }
  #feedList li span { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #feedList time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  #feedList i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  @keyframes slide { from { opacity: 0; transform: translateX(-10px); } }

  /* Kartu detail */
  #card { top: 78px; left: 12px; width: 300px; padding: 14px; }
  #card.hidden { display: none; }
  #card .x { position: absolute; top: 10px; right: 10px; padding: 2px 9px; }
  .card-head { display: flex; gap: 12px; align-items: center; }
  .card-head h3 { margin: 0 0 2px; font-size: 20px; }
  .state-line { margin: 12px 0 8px; display: flex; gap: 8px; align-items: center; }
  .walking { font-size: 12px; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 500; word-break: break-word; }
  code { font-size: 12px; background: #f3ece0; padding: 1px 6px; border-radius: 6px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; font-size: 13px; }
  .hint { margin: 8px 0 0; font-size: 11px; color: var(--muted); text-align: center; }

  /* Label karakter di scene */
  .char-label { pointer-events: none; }
  .char-label .inner { position: relative; transform: translate(var(--dx, 0px), calc(-50% - var(--dy, 0px))); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .char-label .inner::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: var(--ll, 0px); margin-left: -1px; transform-origin: top center; transform: rotate(var(--la, 0rad)); background: linear-gradient(var(--c), transparent); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .char-label.lifted .inner::after { opacity: .7; }
  .tag { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; background: rgba(255,255,255,.95); font-size: 12px; font-weight: 600; box-shadow: 0 2px 0 rgba(0,0,0,.12); border: 2px solid var(--c); white-space: nowrap; }
  .tag .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
  .tag .src { font-size: 9px; padding: 0 4px; border-radius: 6px; background: #eef2ff; color: #3949ab; }
  .tag .src.grok { background: #1f1f1f; color: #fff; }
  .bubble { position: relative; display: flex; align-items: center; gap: 4px; padding: 3px 8px; background: #fff; border-radius: 12px; font-size: 12px; box-shadow: 0 2px 0 rgba(0,0,0,.12); white-space: nowrap; animation: bob 2.4s ease-in-out infinite; }
  .bubble::after { content: ''; position: absolute; bottom: -5px; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .bubble .tx { display: none; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .char-label.fresh .tx, .char-label.hover .tx, .char-label.selected .tx { display: inline; }
  .char-label.selected .tag { background: var(--c); color: #fff; }
  .char-label.alert .bubble { background: #fff3d6; }
  .char-label.alert .bubble::after { border-top-color: #fff3d6; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .zone-label { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #f8fafc; background: rgba(15,23,42,.72); border: 1px solid rgba(56,189,248,.35); padding: 2px 9px; border-radius: 8px; backdrop-filter: blur(4px); white-space: nowrap; pointer-events: none; }

  /* Saklar mode */
  .modebox { padding: 6px; display: flex; align-items: center; gap: 6px; position: static; }
  .seg { display: inline-flex; background: #f3ece0; border-radius: 12px; padding: 2px; }
  .seg button { border: 0; box-shadow: none; background: transparent; padding: 5px 10px; font-size: 13px; }
  .seg button.on { background: var(--ink); color: #fff; }
  .projpick { display: none; align-items: center; gap: 4px; }
  body.project-mode .projpick { display: inline-flex; }
  .projpick select { font: inherit; font-size: 13px; border: 2px solid var(--line); border-radius: 10px; padding: 4px 6px; background: #fff; color: inherit; max-width: 170px; }
  .projpick button { padding: 4px 8px; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
  body.project-mode .winbox, body.project-mode #panel { display: none; }

  /* Panel chat PM. Width and height come from the size controls. */
  #chatPanel { display: none; top: 78px; right: 12px; bottom: 12px; width: var(--cp-w, 320px); flex-direction: column; padding: 12px; gap: 8px; }
  body.project-mode.panel-open #chatPanel { display: flex; }
  .cp-size { position: absolute; top: 10px; right: 10px; display: flex; gap: 2px; z-index: 1; }
  .cp-size button { width: 26px; height: 26px; padding: 0; border-radius: 8px; line-height: 1; font-size: 13px; color: var(--muted); background: transparent; border: 0; box-shadow: none; }
  .cp-size button:hover { background: #f3ece0; color: var(--ink); }
  #chatPanel .cp-head { padding-right: 84px; min-height: 26px; }
  .cp-resize { position: absolute; z-index: 2; left: 0; top: 18px; bottom: 18px; width: 10px; margin-left: -5px; cursor: ew-resize; touch-action: none; }
  .cp-resize::after { content: ''; position: absolute; left: 3px; top: 50%; width: 3px; height: 36px; margin-top: -18px; border-radius: 3px; background: #d9cbb8; }
  body.cp-drag, body.cp-drag * { cursor: ew-resize !important; user-select: none; }
  .cp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cp-title { flex: 1; min-width: 0; }
  .cp-title b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cp-title small { color: var(--muted); font-size: 11px; }
  .cp-pause { width: 100%; font-size: 12px; background: #fff3d6; border-radius: 10px; padding: 4px 8px; }
  .cp-tabs { display: flex; gap: 4px; }
  .cp-tabs button { flex: 1; font-size: 13px; padding: 4px; }
  .sop textarea { width: 100%; font: inherit; border: 2px solid var(--line); border-radius: 10px; padding: 8px; background: #fff; color: inherit; resize: vertical; }
  .sop-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .sop-list button.on { background: var(--ink); color: #fff; }
  .cp-tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: none; }
  .cp-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px; font-size: 13px; }
  .cp-empty { margin: auto; text-align: center; color: var(--muted); padding: 10px; }
  .cp-empty b { color: var(--ink); }
  .cp-foot { display: flex; flex-direction: column; gap: 6px; }
  .cp-foot textarea, .ans textarea { font: inherit; font-size: 13px; width: 100%; resize: vertical; border: 2px solid var(--line); border-radius: 12px; padding: 7px 9px; background: #fff; color: inherit; }
  .cp-actions { display: flex; justify-content: flex-end; gap: 6px; }
  .msg { max-width: 92%; padding: 7px 10px; border-radius: 14px; background: #fff; line-height: 1.45; word-break: break-word; position: relative; }
  .msg time { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; text-align: right; }
  .msg .who { display: block; font-size: 11px; font-weight: 700; color: #d97757; }
  .msg.me { align-self: flex-end; background: #e3f0ff; }
  .msg.me small { display: block; font-size: 10px; color: var(--muted); }
  .msg.them { align-self: flex-start; }
  .msg.sys { align-self: center; background: transparent; color: var(--muted); font-size: 12px; text-align: center; padding: 2px 6px; }
  .msg.sys time { display: inline; margin: 0 4px 0 0; }
  .msg.sys.error { color: #c92a2a; }
  .msg.typing { align-self: flex-start; color: var(--muted); font-style: italic; background: transparent; }
  .msg pre { background: #f3ece0; border-radius: 8px; padding: 6px 8px; overflow-x: auto; font-size: 12px; margin: 4px 0; }
  .msg.card { align-self: stretch; max-width: none; border: 2px solid var(--line); }
  .card-h { font-size: 12px; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .card-h time { display: inline; margin: 0 0 0 auto; }
  .msg.q:not(.done) { border-color: #f2a20c; background: #fffaf0; }
  .msg.perm.open { border-color: #e5484d; background: #fff5f5; }
  .msg.perm small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .msg.rep { border-color: #1fa774; background: #f3fbf6; }
  .tkid { font-size: 10px; background: #eef2ff; color: #3949ab; border-radius: 6px; padding: 0 5px; }
  .ans { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .ans button { align-self: flex-end; }
  .perm-btns { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
  .perm-btns button { font-size: 12px; padding: 4px 8px; }
  .perm-btns .no { color: #c92a2a; }
  .dec { margin-top: 5px; font-size: 12px; font-weight: 600; color: #1fa774; }
  .dec.deny { color: #c92a2a; }
  .tk { background: #fff; border-radius: 12px; padding: 8px 10px; border: 2px solid var(--line); }
  .tk-top { display: flex; align-items: center; gap: 6px; }
  .tk-top small { color: var(--muted); margin-left: auto; }
  .tk-title { font-weight: 600; margin: 3px 0; }
  .tk-sum { font-size: 12px; color: var(--muted); }

  /* Pengaturan project */
  #projModal { position: fixed; inset: 0; background: rgba(30, 24, 18, .35); display: grid; place-items: center; z-index: 10; }
  #projModal[hidden] { display: none; }
  .pm-card { position: relative; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 40px); display: flex; flex-direction: column; padding: 16px; }
  .pm-card h3 { margin: 0 0 10px; }
  .pm-body { overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .pm-body label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
  .pm-body input, .pm-body select { font: inherit; font-weight: 400; border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; background: #fff; color: inherit; }
  .pm-sec { display: flex; flex-direction: column; gap: 6px; }
  .pm-sec > small, .muted { color: var(--muted); font-size: 12px; }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px; }
  .row2 label { min-width: 0; }
  .modelrow { display: flex; gap: 4px; min-width: 0; }
  .modelrow select { flex: 1; min-width: 0; width: 100%; text-overflow: ellipsis; }
  .modelrow button { padding: 2px 9px; }
  .pm-sec .err { color: #c92a2a; font-size: 12px; }
  .flist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .flist li { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 10px; padding: 5px 8px; font-size: 13px; }
  .flist li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flist li button { padding: 1px 7px; }
  .fbrowser { border: 2px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
  .fb-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #f8f3ea; font-size: 13px; }
  .fb-head span:first-of-type { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fbrowser ul { list-style: none; margin: 0; padding: 4px; max-height: 220px; overflow-y: auto; }
  .fbrowser li { padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .fbrowser li:hover { background: #f3ece0; }
  .fb-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 6px 8px; border-top: 2px solid var(--line); }
  .git { font-size: 10px; background: #1fa774; color: #fff; border-radius: 6px; padding: 0 5px; }
  .pm-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .src-badge.opencode, .tag .src.opencode { background: #eef2ff; color: #3949ab; }
  /* Tim & rencana (Tahap 2) */
  .team { display: flex; gap: 4px; flex-wrap: wrap; }
  .team-chip { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 2px solid var(--c); color: var(--c); background: #fff; }
  .team-chip.on { background: var(--c); color: #fff; animation: pulse 1.4s infinite; }
  .msg.sys.handoff { font-size: 12px; color: var(--ink); background: #f8f3ea; border-radius: 10px; padding: 4px 8px; text-align: left; align-self: stretch; }
  .msg.plan.open { border-color: #4f8cff; background: #f3f7ff; }
  .plan-meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .plan-text { max-height: 260px; overflow-y: auto; }
  .plan-btns { display: flex; margin-top: 8px; }
  .rev { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .rev textarea { font: inherit; font-size: 13px; width: 100%; resize: vertical; border: 2px solid var(--line); border-radius: 12px; padding: 7px 9px; background: #fff; color: inherit; }
  .rev button { align-self: flex-end; }
  .holder { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; color: #fff; background: var(--c); }
  .tk details { margin-top: 6px; font-size: 12px; }
  .tk summary { cursor: pointer; color: var(--muted); }
  .tk-doc { margin-top: 6px; padding: 6px 8px; background: #faf6ef; border-radius: 8px; }
  .tk-doc > div { margin-top: 3px; max-height: 220px; overflow-y: auto; }
  .role-head, .role-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) minmax(0, 2fr); gap: 6px; align-items: center; }
  .role-head { font-size: 11px; color: var(--muted); font-weight: 600; }
  .role-row { background: #fff; border-radius: 10px; padding: 5px 6px; }
  .role-row select { font: inherit; font-size: 13px; border: 2px solid var(--line); border-radius: 10px; padding: 4px 6px; background: #fff; color: inherit; min-width: 0; width: 100%; }
  .role-row .err { grid-column: 2 / 4; }
  .role-name { font-weight: 700; color: var(--c); font-size: 13px; }
  .cp-foot[hidden] { display: none; }
  #liteBtn.on { background: #e6fcf5; border-color: #63e6be; }
  .pm-sec.brief textarea { font: inherit; font-weight: 400; border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; background: #fff; color: inherit; resize: vertical; }
  .role-name .later { display: block; font-weight: 500; color: var(--muted); font-size: 10px; }
  .msg.sys.work { font-size: 12px; color: var(--ink); background: #f3efff; border-radius: 10px; padding: 4px 8px; text-align: left; align-self: stretch; }
  .msg.review.fix, .msg.qa.fix { border-color: #f2a20c; background: #fffaf0; }
  .msg.qa.pass { border-color: #1fa774; background: #f3fbf6; }
  .tk-work .dev.qa-uji { background: #fff3bf; }
  .tk-work .dev.qa-lulus { background: #d3f9d8; }
  .tk-work .dev.qa-gagal { background: #ffe3e3; }
  .msg.review.pass { border-color: #1fa774; background: #f3fbf6; }
  .tk-work { margin-top: 6px; font-size: 12px; }
  .tk-work .devs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tk-work .dev { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: #eee; }
  .tk-work .dev.selesai { background: #d3f9d8; }
  .tk-work .dev.perbaikan { background: #fff3bf; }
  .tk-work .dev.kerja { background: #e5dbff; }
  .tk-work .resume { margin-top: 6px; font-size: 12px; padding: 3px 9px; }

  @media (max-width: 760px) {
    #chatPanel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: var(--cp-h, 55vh); border-radius: 18px 18px 0 0; }
    .cp-resize { left: 28px; right: 28px; top: 0; bottom: auto; width: auto; height: 10px; margin: -5px 0 0; cursor: ns-resize; }
    .cp-resize::after { left: 50%; top: 3px; width: 36px; height: 3px; margin: 0 0 0 -18px; }
    body.cp-drag, body.cp-drag * { cursor: ns-resize !important; }
    .modebox .seg span { display: none; }
    #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 36vh; border-radius: 18px 18px 0 0; }
    #feed { display: none; }
    #card { left: 16px; right: 16px; width: auto; top: 70px; }
    .brand small, #stats { display: none; }
    .topbar { left: 16px; right: 16px; flex-wrap: wrap; gap: 8px; }
    .topbar > .brand { flex: 1 1 auto; min-width: 0; }
    .topbar > .clockbox { flex: 1 1 100%; margin-left: 0; overflow-x: auto; scrollbar-width: none; padding: 6px 8px; gap: 6px; }
    .clockbox::-webkit-scrollbar { display: none; }
    .clockbox > * { flex: none; }
    #clock { font-size: 17px; }
    .tag { font-size: 11px; padding: 1px 7px 1px 5px; }
    .bubble { font-size: 11px; padding: 2px 6px; }
    .legend { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="stage"></div>

  <header class="topbar">
    <div class="hud brand"><span class="logo">🏢</span><div><h1 data-i18n="app.title">Agent HQ</h1><small id="mode" data-i18n="app.loading">memuat…</small></div></div>
    <div class="hud modebox">
      <div class="seg"><button data-mode="editors" class="on">🌐 <span data-i18n="mode.editors">Semua Editor</span></button><button data-mode="project">📁 <span data-i18n="mode.project">Project</span></button></div>
      <span class="projpick"><select id="projSelect" data-i18n-aria="mode.project" aria-label="Project"></select><button id="projSettings" data-i18n-title="proj.settings" title="Pengaturan project">⚙️</button></span>
    </div>
    <div class="hud" id="stats"></div>
    <div class="hud clockbox"><span id="clock">--:--</span><button id="timeBtn">🕑 <span data-i18n="hud.clockAuto">Otomatis</span></button>
      <button id="langBtn" title="Language / Bahasa">🇮🇩 ID</button>
      <label class="winbox" data-i18n-title="hud.tooltip.window" title="Rentang waktu agent yang ditampilkan"><span>⏱️</span>
        <select id="windowSelect" data-i18n-aria="hud.windowLabel" aria-label="Rentang waktu">
          <option value="60">1 jam</option>
          <option value="360">6 jam</option>
          <option value="1440" selected>24 jam</option>
          <option value="4320">3 hari</option>
          <option value="10080">7 hari</option>
          <option value="43200">30 hari</option>
        </select>
      </label>
      <button id="panelBtn" data-i18n-title="hud.tooltip.agents" title="Daftar agent (A)">👥 <b id="count"></b></button><button id="liteBtn" title="Mode ringan">🪶</button><button id="fsBtn" data-i18n-title="hud.tooltip.fullscreen" title="Layar penuh">⛶</button></div>
  </header>

  <aside class="hud" id="panel">
    <h2 data-i18n="panel.title">Agent</h2>
    <ul id="agentList"></ul>
    <div class="legend">
      <span>💻 <span data-i18n="zone.desk">Ruang kerja = ngoding / berpikir</span></span>
      <span>⚙️ <span data-i18n="zone.server">Server = jalanin command</span></span>
      <span>📖 <span data-i18n="zone.library">Perpustakaan = baca/cari</span></span>
      <span>✋ <span data-i18n="zone.meeting">Rapat = nunggu kamu</span></span>
      <span>🌳 <span data-i18n="zone.leisure">Taman / Kafe & Kolam / Lapangan = santai</span></span>
      <span>🚑 <span data-i18n="zone.clinic">Klinik = error</span></span>
    </div>
  </aside>

  <aside class="hud" id="chatPanel">
    <div class="cp-resize" id="cpResize" role="separator" aria-orientation="vertical" data-i18n-title="proj.cardDrag" data-i18n-aria="proj.cardDrag" title="Seret untuk mengubah ukuran" aria-label="Seret untuk mengubah ukuran"></div>
    <div class="cp-size">
      <button type="button" id="cpSmaller" data-i18n-title="proj.cardSmaller" data-i18n-aria="proj.cardSmaller" title="Kecilkan" aria-label="Kecilkan">−</button>
      <button type="button" id="cpBigger" data-i18n-title="proj.cardBigger" data-i18n-aria="proj.cardBigger" title="Besarkan" aria-label="Besarkan">+</button>
      <button type="button" id="cpHide" data-i18n-title="proj.cardHide" data-i18n-aria="proj.cardHide" title="Sembunyikan" aria-label="Sembunyikan">✕</button>
    </div>
    <div class="cp-head"></div>
    <div class="cp-tabs"><button data-tab="chat" class="on" data-i18n="proj.tabChat">Chat</button><button data-tab="sop" data-i18n="proj.tabSop">SOP</button></div>
    <div class="cp-body"></div>
    <div class="cp-foot"><textarea id="cpInput" rows="2" data-i18n-aria="proj.inputPh"></textarea>
      <div class="cp-actions"><button id="cpStop" hidden data-i18n="proj.stop">Hentikan</button><button id="cpSend" class="primary" data-i18n="proj.send">Kirim</button></div></div>
  </aside>

  <div id="projModal" hidden>
    <div class="pm-card hud">
      <h3 data-i18n="proj.settings">Pengaturan project</h3>
      <div class="pm-body"></div>
      <div class="pm-foot"><button id="pmCancel" data-i18n="proj.cancel">Batal</button><button id="pmSave" class="primary" data-i18n="proj.save">Simpan</button></div>
    </div>
  </div>

  <section class="hud" id="feed"><h3 data-i18n="hud.activity">Aktivitas</h3><ul id="feedList"></ul></section>

  <div class="hud hidden" id="card"><button class="x" aria-label="Tutup">✕</button><div class="body"></div></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
